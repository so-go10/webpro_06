<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>京葉線の駅を追加</title>
</head>
<body>
  <h1>京葉線の駅を追加</h1>

  <form action="/keiyo_add" method="get">
    <p>
      <label>ID：
        <input type="text" name="id" required>
      </label>
    </p>
    <p>
      <label>駅コード：
        <input type="text" name="code" required>
      </label>
    </p>
    <p>
      <label>駅名：
        <input type="text" name="name" required>
      </label>
    </p>
    <button type="submit">駅を追加</button>
  </form>
</body>
</html>
