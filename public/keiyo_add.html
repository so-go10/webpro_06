<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>好きな格闘技を追加</title>
</head>
<body>
  <h1>好きな格闘技を追加</h1>

  <form action="/fight_add" method="get">
    <p>
      <label>ID：
        <input type="number" name="id" required>
      </label>
    </p>
    <p>
      <label>格闘技名：
        <input type="text" name="name" required>
      </label>
    </p>
    <p>
      <label>種類：
        <input type="text" name="category" required>
      </label>
    </p>
    <p>
      <label>特徴：
        <input type="text" name="feature" required>
      </label>
    </p>
    <button type="submit">追加する</button>
  </form>

  <p><a href="/fight">格闘技一覧を見る</a></p>
</body>
</html>
